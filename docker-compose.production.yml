services:
  app:
    image: portfolio-backend:${RELEASE_TAG:-local}
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Keep the existing production APP_KEY}
      APP_URL: ${APP_URL:?Set the public gateway URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:?Set the existing database password}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    volumes:
      - storage_data:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: portfolio-frontend:${RELEASE_TAG:-local}
    build:
      context: .
      target: frontend
    restart: unless-stopped

  nginx:
    image: portfolio-gateway:${RELEASE_TAG:-local}
    build:
      context: .
      target: gateway
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - storage_data:/var/www/storage:ro
    depends_on:
      - app
      - frontend

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set the existing database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  storage_data:
