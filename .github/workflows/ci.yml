name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare isolated CI environment
        run: |
          cp .env.example .env
          docker compose build app
          docker compose up -d --wait postgres app
          docker compose exec -T app composer install --no-interaction --prefer-dist
          docker compose exec -T app php artisan key:generate --no-interaction
          docker compose exec -T postgres createdb -U laravel portfolio_test

      - name: Backend tests
        run: docker compose exec -T app php artisan test --compact

      - name: Unified frontend build
        run: |
          npm ci --include=dev
          npm run build

      - name: Same-origin production integration
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Remove CI containers
        if: always()
        run: docker compose down --volumes
